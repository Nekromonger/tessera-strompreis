# What tools/preview.py shows: an EPEX Spot sensor with yesterday, today and tomorrow (hourly), in ct/kWh as bars and
# in EUR/kWh as a stepped line. Only the first two slots need their start: the tile cuts today and tomorrow by it.
tiles:
  - tile: epex
    name: Strompreis
    entity: sensor.epex_spot_data_total_price
    options: { unit: cents, fixed: 1 }
    sizes: [1x1, 2x1, 2x2, 4x2, 4x3]
  - tile: epex
    name: EPEX line
    entity: sensor.epex_spot_data_total_price
    options: { unit: eur, fixed: 3, graph: line, grid: dotted }
    sizes: [2x2, 4x2]

